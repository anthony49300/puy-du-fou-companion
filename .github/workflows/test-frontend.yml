name: Tests frontend

on:
  push:
    paths: ["site/js/**", "tests/frontend/**", "package.json"]
  pull_request:
    paths: ["site/js/**", "tests/frontend/**", "package.json"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
