<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spectacles — Puy du Fou (non officiel)</title>
<meta name="description" content="Liste des spectacles du Puy du Fou avec statistiques et historique du nombre de représentations par jour.">
<script>(function(){try{var t=localStorage.getItem("pdf-programmes-theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="spectacles">

<header id="site-header"></header>

<main>
  <div class="container">
    <section class="page-hero">
      <h1>🎭 Les spectacles</h1>
      <p class="lede">Retrouvez tous les spectacles, leurs statistiques et l'évolution de leur nombre de représentations. Cliquez sur une carte pour afficher son historique détaillé.</p>
    </section>

    <div class="search-bar">
      <div id="search-slot"></div>
      <select id="category-filter" class="filter-select" aria-label="Filtrer par catégorie">
        <option value="">Toutes les catégories</option>
      </select>
    </div>

    <div class="card-grid" id="spectacles-grid">
      <div class="card"><div class="skeleton" style="height:6rem;"></div></div>
      <div class="card"><div class="skeleton" style="height:6rem;"></div></div>
      <div class="card"><div class="skeleton" style="height:6rem;"></div></div>
    </div>

    <div id="detail-panel" class="detail-panel" hidden></div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/app.js"></script>
<script src="js/spectacles.js"></script>
</body>
</html>
