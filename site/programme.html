<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programme du jour — Puy du Fou (non officiel)</title>
<meta name="description" content="Programme du jour des spectacles du Puy du Fou, trié par heure, avec recherche et filtres par catégorie.">
<script>(function(){try{var t=localStorage.getItem("pdf-programmes-theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="programme">

<header id="site-header"></header>

<main>
  <div class="container">
    <section class="page-hero">
      <h1>📜 Programme du jour</h1>
      <p class="lede" id="programme-date">Chargement de la date…</p>
    </section>

    <div id="status-banner-slot"></div>

    <div class="search-bar">
      <div id="search-slot"></div>
      <select id="category-filter" class="filter-select" aria-label="Filtrer par catégorie">
        <option value="">Toutes les catégories</option>
      </select>
    </div>

    <div id="programme-content">
      <div class="empty-state">
        <div class="skeleton" style="height:2.4rem;max-width:420px;margin:0 auto;"></div>
      </div>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="js/app.js"></script>
<script src="js/programme.js"></script>
</body>
</html>
