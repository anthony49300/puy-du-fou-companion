<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programme du jour — Puy du Fou (non officiel)</title>
<meta name="description" content="Programme du jour des spectacles du Puy du Fou, trié par heure, avec recherche et filtres par catégorie.">
<script>(function(){try{var t=localStorage.getItem("pdf-programmes-theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="programme">

<header id="site-header"></header>

<main>
  <div class="container">
    <section class="page-hero prog-hero">
      <div class="prog-hero-top">
        <div class="prog-hero-titles">
          <p class="label-upper" id="programme-meta">&nbsp;</p>
          <h1>Programme</h1>
          <p class="prog-freshness" id="programme-freshness"></p>
        </div>
        <button type="button" class="icon-btn" id="search-toggle" aria-label="Rechercher" aria-expanded="false" aria-controls="search-bar-wrap"></button>
        <button type="button" class="icon-btn" id="custom-date-toggle" aria-label="Choisir une date" aria-haspopup="true" aria-expanded="false"></button>
        <div class="segmented" id="day-select" role="group" aria-label="Jour affiché"></div>
        <button type="button" class="prog-date-chip" id="custom-date-chip" hidden></button>
        <div class="search-bar" id="search-bar-wrap" hidden>
          <div id="search-slot"></div>
        </div>
      </div>
      <input type="date" id="custom-date-input" hidden>
    </section>

    <div id="status-banner-slot" aria-live="polite"></div>
    <div id="unusual-banner-slot" aria-live="polite"></div>

    <div class="chip-row chip-row--scroll" id="category-filter-chips" role="group" aria-label="Filtrer par catégorie"></div>

    <div id="continuous-gantt-slot" class="section"></div>

    <div class="hour-nav" id="hour-nav" hidden></div>

    <div class="programme-layout">
      <div class="programme-main">
        <div id="programme-content" aria-live="polite">
          <div class="empty-state">
            <div class="skeleton" style="height:2.4rem;max-width:420px;margin:0 auto;"></div>
          </div>
        </div>
        <!-- Vue desktop (>= 1100px, voir style.css) : grille horaire, une
             ligne par spectacle. Remplace #programme-content à cette
             largeur plutôt que de la dupliquer en JS. -->
        <div class="hgrid-wrap hgrid-only">
          <div class="hgrid" id="hgrid" aria-label="Grille horaire des spectacles"></div>
        </div>
      </div>
      <aside class="programme-aside" aria-label="Ma journée">
        <div id="aside-next-slot"></div>
        <div id="aside-myday-slot"></div>
      </aside>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script src="js/day-plan.js"></script>
<script src="js/schedule-stats.js"></script>
<script src="js/programme.js"></script>
</body>
</html>
